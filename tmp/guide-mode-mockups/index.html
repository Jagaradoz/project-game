;padding:9px}.note{margin:0 16px 20px;flex-direction:column;gap:15px}.session{padding:12px;gap:10px}.session .muted{display:none}.panel-label{font-size:10px;left:10px;top:10px}.cam-foot{left:8px;font-size:10px}.brand{font-size:16px}.tabs button{font-size:12px;padding:8px 10px}}\n</style></head><body>\n<header class=\"lab\"><div><strong>Guide Mode / Design lab</strong><small>Five layout ideas · interactive HTML mockup · simulated camera & events</small></div><nav class=\"tabs\" aria-label=\"Layout ideas\"></nav></header>\n<section class=\"intro\"><div><h1 id=\"ideaTitle\"></h1><p id=\"ideaDesc\"></p></div><span class=\"pill\">Same 3 elements. Different priorities.</span></section>\n<main class=\"viewport a\" id=\"app\"><header class=\"session\"><span class=\"brand\">Guide Mode</span><span class=\"muted\">20-minute guided session</span><span class=\"timer\" id=\"timer\">20:00</span><span class=\"state-tag\" id=\"tracking\">● Tracking ready</span></header><div class=\"track\"><span id=\"progress\"></span></div>\n<div class=\"stage\"><section class=\"panel camera\" aria-label=\"Camera preview\"><div class=\"room\"></div><span class=\"panel-label\">You / Camera + skeleton</span><div id=\"cameraPerson\"></div><span class=\"cam-foot\">Full body in frame · simulated view</span></section><section class=\"panel character\" aria-label=\"Character response\"><div class=\"world\"></div><span class=\"panel-label\">Character response</span><div id=\"characterPerson\"></div><div class=\"response\" id=\"response\">Ready to move<span>Your movement becomes a game action</span></div></section><section class=\"panel guide\" aria-label=\"Visual pose guidance\"><span class=\"panel-label\">Follow the guide</span><div id=\"guideArt\" class=\"guide-art\"></div><div><small id=\"phase\">Warm-up / Round 1</small><h2 id=\"poseTitle\"></h2><p id=\"instruction\"></p><div class=\"count\" id=\"reps\">0 <small>/ 5 reps</small></div><div class=\"dots\" id=\"dots\"></div><div class=\"next\" id=\"next\"></div></div></section></div>\n<footer class=\"dock\"><button class=\"primary\" id=\"start\">Start preview</button><button id=\"skip\">Skip pose</button><span class=\"spacer\"></span><small>Tools stay out of your way</small><button data-open=\"measure\">Measurements</button><button data-open=\"logs\">Event log <span id=\"badge\">1</span></button><button data-open=\"plan\">Session</button></footer>\n<div class=\"scrim hidden\" id=\"scrim\"></div><aside class=\"overlay hidden\" id=\"overlay\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Session tools\"></aside>\n</main><footer class=\"note\"><div><strong id=\"recommendation\"></strong><br><span id=\"tradeoff\"></span></div><div class=\"tools\" aria-label=\"Preview scenarios\"><button id=\"detect\">Simulate successful rep</button><button id=\"lost\">Simulate tracking loss</button><button id=\"rest\">Preview rest</button><button id=\"finish\">Preview completion</button></div></footer>\n<script>\nconst ideas=[['a','A · Balanced trio','Three equal voices','Camera, character and instructions share the stage. Everything is visible at a glance.','Best starting point','Easy to understand; each view has less space.'],['b','B · Camera first','See yourself clearly','A large camera view makes body positioning the focus. Guidance and character sit beside it.','Best for learning form','Strongest self-check; smaller character response.'],['c','C · Character first','Make practice feel like play','Your character leads the session, with your camera and visual guide together on the left.','Best for game motivation','Most immersive; body positioning gets less emphasis.'],['d','D · Mirror studio','Compare your pose side by side','Your camera and guide face each other at equal size. Character feedback runs along the bottom.','Best for pose comparison','Clearest imitation; character response is a supporting strip.'],['e','E · Coach corner','A quieter coaching workspace','Camera on the left, visual coaching above character feedback on the right.','Best compact arrangement','Clear reading order; guide and character share a column.']];\nconst poses=[{name:'Step side to side',instruction:'Step left, return to centre, then step right.',effect:'Lane changed',next:'Alternate knee lifts',kind:0},{name:'Alternate knee lifts',instruction:'Lift one knee, lower it, then switch sides.',effect:'Character running',next:'Hands on hips',kind:1},{name:'Hands on hips',instruction:'Place both hands on your hips, then release.',effect:'Shield activated',next:'Overhead clap',kind:2},{name:'Overhead clap',instruction:'Raise both arms and bring your hands together above your head.',effect:'Character jumping',next:'Short rest',kind:3}];\nlet idea=0,pose=0,count=0,round=1,seconds=1200,running=false,lost=false,resting=false,complete=false,auto=false,modal=null,events=[{time:'20:00',text:'Preview ready. No camera access requested.'}],returnFocus=null;\nconst $=s=>document.querySelector(s);function body(kind,skin,shirt,outline=false){const arms=kind===3?'M91 100 L65 56 L113 27 M149 100 L175 56 L127 27':kind===2?'M91 100 L60 138 L96 151 M149 100 L180 138 L144 151':'M91 100 L68 146 L57 178 M149 100 L171 140 L183 170';const legs=kind===1?'M106 174 L77 208 L114 224 M135 174 L148 231 L151 283':kind===0?'M106 174 L78 225 L56 280 M135 174 L151 231 L174 280':'M106 174 L99 230 L91 283 M135 174 L141 230 L150 283';return `<svg class=\"${outline?'':'person'}\" style=\"${outline?'width:100%;height:100%':''}\" viewBox=\"0 0 240 310\" role=\"img\" aria-label=\"${poses[kind].name} illustration\"><ellipse cx=\"120\" cy=\"292\" rx=\"64\" ry=\"9\" fill=\"#17120e18\"/><g stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"${legs}\" fill=\"none\" stroke=\"${outline?'#142ce6':'#384b5b'}\" stroke-width=\"${outline?9:22}\"/><path d=\"${arms}\" fill=\"none\" stroke=\"${outline?'#142ce6':skin}\" stroke-width=\"${outline?9:18}\"/><path d=\"M94 99 Q120 87 146 99 L141 177 Q120 185 99 177Z\" fill=\"${shirt}\" stroke=\"${outline?'#142ce6':shirt}\" stroke-width=\"5\"/><circle cx=\"120\" cy=\"65\" r=\"23\" fill=\"${skin}\" stroke=\"${outline?'#142ce6':skin}\" stroke-width=\"3\"/>${outline?'':`<path d=\"M98 60 Q98 31 123 40 Q143 36 144 60 L132 51 L108 54Z\" fill=\"#352923\"/>`}${outline?'':`<path d=\"M104 284 L88 287 M150 284 L164 287\" stroke=\"#272a2a\" stroke-width=\"12\"/>`}</g>${outline?'<path d=\"M28 200 L10 200 M212 200 L230 200\" stroke=\"#fe6601\" stroke-width=\"4\"/>':''}</svg>`}\nfunction camera(kind){return body(kind,'#b68c71','#586976').replace('</svg>',`<g class=\"skeleton\" fill=\"none\"><path d=\"M120 88 L120 174 M91 100 L149 100 M106 174 L135 174\"/><circle cx=\"120\" cy=\"88\" r=\"4\"/><circle cx=\"106\" cy=\"174\" r=\"4\"/><circle cx=\"135\" cy=\"174\" r=\"4\"/><circle cx=\"91\" cy=\"100\" r=\"4\"/><circle cx=\"149\" cy=\"100\" r=\"4\"/></g></svg>`)}\nfunction selectIdea(i){idea=i;$('#app').className='viewport '+ideas[i][0];$('#ideaTitle').textContent=ideas[i][2];$('#ideaDesc').textContent=ideas[i][3];$('#recommendation').textContent=ideas[i][4];$('#tradeoff').textContent=ideas[i][5];document.querySelectorAll('.tabs button').forEach((b,j)=>b.setAttribute('aria-pressed',j===i));}\nideas.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x[1];b.onclick=()=>selectIdea(i);$('.tabs').append(b)});\nfunction log(text){events.unshift({time:time(),text});events=events.slice(0,100);$('#badge').textContent=events.length;if(modal==='logs')fillOverlay()}\nfunction time(){return `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`}\nfunction render(){const p=poses[pose];$('#timer').textContent=time();$('#progress').style.width=(1200-seconds)/12+'%';$('#poseTitle').textContent=p.name;$('#instruction').textContent=p.instruction;$('#phase').textContent=round===1?'Learn the movements / Round 1':`Guided practice / Round ${round}`;$('#reps').innerHTML=count+' <small>/ 5 reps</small>';$('#dots').innerHTML=Array.from({length:5},(_,i)=>`<i class=\"${i<count?'done':''}\"></i>`).join('');$('#next').textContent='Up next: '+p.next;$('#cameraPerson').innerHTML=camera(p.kind);$('#characterPerson').innerHTML=body(p.kind,'#d9ad86','#fe6601');$('#guideArt').innerHTML=body(p.kind,'#fffdf7','#e8ecff',true);$('#tracking').textContent=lost?'● Tracking paused':'● Tracking ready';$('#tracking').className='state-tag'+(lost?' warn':'');$('#start').textContent=complete?'Restart preview':running?'Pause':'Start / resume';}\nfunction rep(){if(complete||resting||lost||auto)return;count++;log(`${poses[pose].name}: repetition ${count} counted.`);$('#response').innerHTML=poses[pose].effect+'<span>Movement recognised · simulated</span>';render();if(count===5){auto=true;log('Pose complete. Next pose starts in 3 seconds.');show('transition');setTimeout(()=>{if(!auto)return;auto=false;advance();if(modal==='transition')closeOverlay()},3000)}}\nfunction advance(){count=0;pose++;if(pose===poses.length){pose=0;round++;beginRest();}else{log('Next pose: '+poses[pose].name);render()}}\nfunction beginRest(){resting=true;log('Rest started.');show('rest');render()}\nfunction show(type){returnFocus=document.activeElement;modal=type;$('#overlay').className='overlay'+(['rest','transition','lost','complete'].includes(type)?' center-overlay':'');$('#scrim').classList.remove('hidden');fillOverlay();$('#overlay').querySelector('button')?.focus()}\nfunction fillOverlay(){const headings={measure:'Measurements',logs:'Event log',plan:'Your 20-minute session',rest:'Take a short rest',transition:'Pose complete',lost:'Step back into view',complete:'Session complete'};let html=`<header><div><h2>${headings[modal]}</h2><small>Simulated preview</small></div><button id=\"close\" aria-label=\"Close overlay\">×</button></header>`;\nif(modal==='measure')html+='<div class=\"metrics\">'+[['28','FPS'],['124 ms','Latency P95'],['96%','Pose confidence'],[count,'Current repetitions']].map(x=>`<div class=\"metric\"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')+'</div><p>Sample values for layout review.</p>';\nif(modal==='logs')html+='<small>Newest first · session only</small><ol class=\"events\">'+events.map(x=>`<li><time>${x.time} remaining</time>${x.text}</li>`).join('')+'</ol><button id=\"export\">Export JSON</button> <button id=\"clear\">Clear</button>';\nif(modal==='plan')html+='<ol class=\"events\"><li><b>0–2 min / Learn</b><br>Watch and try each movement.</li><li><b>2–17 min / Guided rounds</b><br>Repeat the four poses, five reps each. Rest between rounds.</li><li><b>17–20 min / Easy finish</b><br>Slower stepping and knee lifts.</li></ol><p>Count successful reps, then automatically introduce the next pose. Pause the session timer if tracking is lost.</p><small>Proposed pacing for review; actual exercise duration may vary.</small>';\nif(modal==='rest')html+='<p>Relax your arms. Continue when you feel ready.</p><p><b>Up next: Step side to side</b></p><button class=\"primary\" id=\"continue\">Continue session</button>';\nif(modal==='transition')html+='<p>5 / 5 repetitions recognised.</p><p><b>Up next: '+poses[(pose+1)%4].name+'</b></p><p>Advancing automatically in 3 seconds…</p>';\nif(modal==='lost')html+='<p>Keep your head and knees visible. Repetitions and the session timer are paused.</p><button class=\"primary\" id=\"recover\">Simulate tracking restored</button>';\nif(modal==='complete')html+='<p>Your guided session has finished.</p><p><b>'+events.filter(x=>x.text.includes('counted')).length+' simulated reps · '+(round-1)+' rounds</b></p><button class=\"primary\" id=\"restart\">Try another layout</button>';\n$('#overlay').innerHTML=html;$('#close').onclick=closeOverlay;$('#continue')?.addEventListener('click',()=>{resting=false;log('Rest ended. Ready for next round.');closeOverlay()});$('#recover')?.addEventListener('click',()=>{lost=false;log('Tracking restored. Session resumed.');closeOverlay();render()});$('#restart')?.addEventListener('click',reset);$('#clear')?.addEventListener('click',()=>{events=[];log('Event log clear
